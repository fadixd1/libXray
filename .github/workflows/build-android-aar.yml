name: Build libXray Android AAR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13113456"

      - name: Setup gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gomobile version || true
          gomobile init

      - name: Build libXray AAR
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          GOFLAGS: "-ldflags=-checklinkname=0"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"

          gomobile bind \
            -target=android \
            -androidapi=26 \
            -o "$GITHUB_WORKSPACE/out/libXray.aar" \
            .

      - name: Verify AAR
        run: |
          test -s "$GITHUB_WORKSPACE/out/libXray.aar"
          ls -lh "$GITHUB_WORKSPACE/out/libXray.aar"

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: libXray-android-aar
          path: out/libXray.aar
          retention-days: 30
